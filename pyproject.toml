[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-glsl"
version = "0.1.0"
description = "GPU-native GLSL compute for ComfyUI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ComfyUI GLSL Team" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "glsl-compiler>=1.0.0",
    "pyvulkan>=0.2.0",
    "numpy>=1.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ComfyUI-GLSL"
Repository = "https://github.com/yourusername/ComfyUI-GLSL"

[tool.setuptools.packages.find]
where = ["."]
include = ["comfyui_glsl*"]